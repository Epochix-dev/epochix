name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default: every job gets a read-only token unless it
# says otherwise. The release jobs that need to write declare it themselves
# (a job-level block replaces this one rather than adding to it), and none
# of them check out the repo, so read is genuinely all the rest need.
permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # Single build: epochix is pure-Python (py3-none-any), so one runner is
  # correct. `uv build --wheel` builds the wheel DIRECTLY from source — NOT
  # `uv build`, which builds the wheel from an intermediate sdist that omits
  # the force-included frontend bundle (those files are untracked), shipping a
  # UI-less wheel. The guard below fails loudly if the dashboard ever goes
  # missing again.
  build-wheel:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: frontend/dist/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build --wheel
      - name: Verify the frontend bundle is inside the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          if not any(n.endswith("epochix/_frontend/dist/index.html") for n in names):
              sys.exit(f"FATAL: {whl} has no dashboard (epochix/_frontend/dist/index.html). "
                       "The wheel would serve an API with no UI.")
          print(f"OK: dashboard bundled in {whl}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      # PyPI's upload backend intermittently 5xx's on the first attempt and
      # succeeds a couple of minutes later. Auto-retry once after a short wait;
      # skip-existing keeps the retry safe if the first attempt partially
      # uploaded. Saves hand-clicking "Re-run failed jobs".
      - name: Publish to PyPI (attempt 1)
        id: pub1
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Wait, then retry once
        if: steps.pub1.outcome == 'failure'
        run: sleep 180
      - name: Publish to PyPI (attempt 2)
        if: steps.pub1.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  # ── SBOM — generate a CycloneDX software-bill-of-materials from the wheel ──
  sbom:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach to release
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      # Install the wheel into a scratch env and scan THAT, not dist/.
      # Syft's Python cataloguer reads `*.dist-info/METADATA` from installed
      # packages; pointed at a directory of unbuilt archives it finds nothing
      # and still emits a valid CycloneDX document — v0.5.79 shipped one with
      # zero components. An SBOM that reports no dependencies is worse than no
      # SBOM, because scanners consume it and report all-clear.
      #
      # Scanning the installed env is also the honest subject: it is what a
      # user actually gets from `pip install epochix`, transitive deps included.
      - name: Install the wheel into a scratch environment
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --quiet --upgrade pip
          /tmp/sbomenv/bin/pip install --quiet dist/*.whl
          /tmp/sbomenv/bin/pip list

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: /tmp/sbomenv
          format: cyclonedx-json
          artifact-name: sbom-${{ github.ref_name }}.cyclonedx.json
          output-file: sbom.cyclonedx.json

      # A green scan step proves syft ran, not that it found anything — the
      # empty SBOM above was produced by a step that "succeeded".
      - name: Fail if the SBOM lists no components
        run: |
          python - <<'PY'
          import json, sys

          with open("sbom.cyclonedx.json", encoding="utf-8") as fh:
              bom = json.load(fh)
          n = len(bom.get("components", []))
          print(f"SBOM components: {n}")
          if n < 10:
              sys.exit(f"::error::SBOM has {n} components; epochix alone has 10 runtime deps")
          PY
      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: sbom.cyclonedx.json
          fail_on_unmatched_files: true

  # ── .vsix build (archive copy; full publish via vscode-release.yml) ────────
  build-vsix:
    # Builds .vsix for the PyPI release archive.
    # Full Marketplace + Open VSX publish is handled by vscode-release.yml.
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: epochix-vscode/webview-dist/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      # vsce package's prepublish hook rebuilds the webview via vite in
      # ../frontend, so install the frontend's deps too.
      - run: npm --prefix frontend ci && npm --prefix epochix-vscode ci && cd epochix-vscode && npx vsce package --no-dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: epochix-vscode/*.vsix
