name: Benchmarks

on:
  pull_request:
    paths:
      - "src/epochix/parsers/**"
      - "src/epochix/store/**"
      - "src/epochix/normalizer/**"
      - "scripts/benchmark-parsers.py"
      - "scripts/compare_benchmarks.py"
      - "tests/benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

# Least privilege by default: every job gets a read-only token unless it
# says otherwise. The release jobs that need to write declare it themselves
# (a job-level block replaces this one rather than adding to it), and none
# of them check out the repo, so read is genuinely all the rest need.
permissions:
  contents: read

jobs:
  parser-throughput:
    name: Record benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      # hatchling force-includes frontend/dist into the wheel; the editable
      # install builds metadata through the same path, so the source dir must
      # exist even though the docs/benchmarks jobs never build the real bundle.
      - name: Ensure frontend/dist exists (force-include source)
        run: mkdir -p frontend/dist

      - name: Install package
        run: pip install -e ".[dev]"

      # On a PR the comparison below judges the targets, knowing what the base
      # branch measures on the same runner.
      - name: Run parser benchmark
        if: github.event_name != 'pull_request'
        run: python scripts/benchmark-parsers.py --lines 100000 --rounds 5

      # Fails on a crash, not on a slow run: the speeds here are not asserted.
      # Ignoring the exit code once hid every benchmark erroring at setup; all
      # that showed was a missing artifact in the next job.
      - name: Run parser and store benchmarks (pytest-benchmark)
        run: |
          pytest tests/benchmarks/ -v --benchmark-min-rounds=3 \
            --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json

  # Both trees on one runner: numbers from separate runs differ by a third
  # with no change to the code, depending on which kind of runner each got.
  benchmark-compare:
    name: Compare benchmarks vs. base
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Ensure frontend/dist exists (force-include source)
        run: mkdir -p frontend/dist

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Check out the base branch beside it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach ../base "$BASE_SHA"

      - name: Compare parser throughput
        run: python scripts/compare_benchmarks.py --base-src ../base/src
