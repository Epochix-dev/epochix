name: Benchmarks

on:
  pull_request:
    paths:
      - "src/epochix/parsers/**"
      - "src/epochix/store/**"
      - "src/epochix/normalizer/**"
      - "scripts/benchmark-parsers.py"
  workflow_dispatch:

# Least privilege by default: every job gets a read-only token unless it
# says otherwise. The release jobs that need to write declare it themselves
# (a job-level block replaces this one rather than adding to it), and none
# of them check out the repo, so read is genuinely all the rest need.
permissions:
  contents: read

jobs:
  parser-throughput:
    name: Parser throughput (≥ 50k lines/sec)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      # hatchling force-includes frontend/dist into the wheel; the editable
      # install builds metadata through the same path, so the source dir must
      # exist even though the docs/benchmarks jobs never build the real bundle.
      - name: Ensure frontend/dist exists (force-include source)
        run: mkdir -p frontend/dist

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run parser benchmark
        run: python scripts/benchmark-parsers.py --lines 100000

      - name: Run store benchmark (pytest-benchmark)
        run: |
          pip install pytest-benchmark
          pytest tests/benchmarks/ -v --benchmark-min-rounds=3 \
            --benchmark-json=benchmark-results.json || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json

  # Optional: compare against base branch (only on PRs)
  benchmark-compare:
    name: Compare benchmarks vs. base
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: parser-throughput

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download PR benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: benchmark-results
          path: pr-results/

      - name: Report
        run: |
          if [ -f pr-results/benchmark-results.json ]; then
            echo "Benchmark results available at pr-results/benchmark-results.json"
            python -c "
          import json, sys
          data = json.load(open('pr-results/benchmark-results.json'))
          benchmarks = data.get('benchmarks', [])
          print(f'Total benchmarks: {len(benchmarks)}')
          for b in benchmarks:
              mean_ms = b['stats']['mean'] * 1000
              print(f\"  {b['name']}: {mean_ms:.2f}ms mean\")
          "
          else
            echo "No benchmark results found."
          fi
