name: CodeQL

# Static security analysis for the two languages that actually ship: the
# Python package and the TypeScript/JavaScript that runs in the dashboard and
# the VS Code extension. The 0.5.50/0.5.51 audit was manual — this makes the
# same class of check run on every change rather than when someone remembers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory finds the code even when the repo
    # is quiet.
    - cron: "27 4 * * 1"

# Least privilege by default: every job gets a read-only token unless it
# says otherwise. The release jobs that need to write declare it themselves
# (a job-level block replaces this one rather than adding to it), and none
# of them check out the repo, so read is genuinely all the rest need.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          language: ${{ matrix.language }}
          # security-extended adds the injection and path-traversal queries that
          # matter here: this package reads untrusted log files, renders their
          # contents into HTML, Markdown and images, and spawns ssh.
          queries: security-extended
          # Project-local sanitiser models, referenced by path. Keyed by
          # language so the pack only loads for the Python run — it targets
          # codeql/python-all and means nothing to the JS analysis.
          # See .github/codeql/epochix-models/.
          config: |
            packs:
              python:
                - ./.github/codeql/epochix-models

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
