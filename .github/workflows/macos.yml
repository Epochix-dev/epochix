name: macOS

# macOS, off the PR path. Its runners queue: on 2026-11-19 four PRs' macOS
# jobs waited 15-18 minutes for one and were cancelled without running a step,
# while every Ubuntu and Windows job had passed. No user of the project runs on
# a Mac yet, so a PR should not wait on one; but one will, so it is still
# tested, on what lands rather than on every proposal:
#
#   - every push to main, so a change that breaks macOS is known the day it lands;
#   - once a week, for what changes underneath (runner images, Python builds);
#   - on demand (Actions > macOS > Run workflow);
#   - on a PR labelled `macos`, for a change you expect to differ on a Mac
#     (paths, sockets, terminals, browsers), and on a PR that changes this file.
#
# A red run outside a PR opens one issue, or adds to the open one.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  decide:
    # Whether a PR asked for macOS. Anything that is not a PR always runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.ask.outputs.run }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'macos') }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$LABELLED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh pr view "$PR" --json files --jq '.files[].path')
          if printf '%s\n' "$files" | grep -qxE '\.github/workflows/(macos|browser)\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not labelled macos: macOS runs after this lands on main." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    # ci.yml's test job on macOS, at the oldest and newest Python it tests.
    needs: decide
    if: needs.decide.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    name: test (macos-latest, ${{ matrix.python }})
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install ${{ matrix.python }}
      - run: uv run --extra dev pytest -q tests/unit tests/integration
        env:
          EPOCHIX_DB: ":memory:"

  browser:
    # WebKit on a real Mac is the closest CI gets to Safari.
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/browser.yml
    with:
      os: macos-latest

  report:
    needs: [decide, test, browser]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: macOS breaks the tests
    steps:
      - name: Open the issue, or add this run to the open one
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "A run on macOS failed. Ubuntu and Windows run on every PR; macOS runs after a change lands, weekly, and on PRs labelled macos: $RUN_URL"
          fi
