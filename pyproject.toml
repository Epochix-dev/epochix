[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "epochix"
version = "0.5.95"
description = "Turn ML training logs into a plain-English story with a letter grade — a live animated dashboard, no code changes."
authors = [{ name = "Epochix Team" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["machine-learning", "training", "visualization", "mlops", "deep-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Visualization",
  "Framework :: FastAPI",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.31",
  "typer>=0.15",
  "structlog>=24.1",
  "python-ulid>=3.0",
  "anyio>=4.4",
  "aiofiles>=24.1",
  # Core, not an extra: GIF export is a headline feature and pillow is a
  # clean wheel on every supported platform (16 MB, no system libraries).
  # Asking for a second install to get the shareable artefact was friction
  # for no benefit — unlike weasyprint, which genuinely cannot be core.
  "pillow>=10.0",
  # PDF export. Pure Python (fonttools + defusedxml + pillow, all wheels),
  # so unlike WeasyPrint it can be a default: weasyprint needs GTK system
  # libraries and its import dies on a stock Windows machine, which would
  # have broken `pip install epochix` for a whole platform.
  "fpdf2>=2.7",
]

[project.optional-dependencies]
# Empty alias: PDF works from the base install now. Kept so existing
# `pip install 'epochix[pdf]'` commands and docs keep working.
pdf       = []
# Retained so existing `pip install 'epochix[gif]'` commands, docs and blog
# posts keep working. pillow is a core dependency now, so this is empty.
gif       = []
lightning = ["pytorch-lightning>=2.3"]
hf        = ["transformers>=4.40"]
llm       = ["httpx>=0.27"]
# Postgres-backed hosted mode also ships the Alembic migration runner.
postgres  = ["asyncpg>=0.30", "alembic>=1.13"]
redis     = ["redis>=5.0"]
# mkdocs pinned <2: the 2.0 rewrite removes the plugin system that
# mkdocs-material + mkdocstrings depend on.
docs      = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
all       = ["epochix[pdf,gif,lightning,hf,llm]"]
dev       = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.108",
  # Pinned exactly so `ruff format --check` is a reproducible CI gate — a new
  # ruff style release must not turn the format check red without a deliberate
  # bump here + a reformat commit.
  "ruff==0.15.15",
  "mypy>=1.11",
  # Static security scan of our own source. Ruff's S-rules overlap it but do
  # not cover B613 (bidirectional control characters), which is what actually
  # caught a live U+202E hiding inside a docstring here.
  "bandit>=1.7",
  # Alembic is imported by store/migrations/*; needed for a hermetic
  # `mypy --strict` run in CI even though SQLite mode doesn't use it.
  "alembic>=1.13",
  "playwright>=1.45",
  # The %epochix magics are only reachable through a real IPython shell; without
  # this the jupyter tests would silently skip in CI.
  "ipython>=8.18",
  "schemathesis>=3.34",
  "pre-commit>=3.8",
  "httpx>=0.27",
]

[project.urls]
Homepage      = "https://epochix.dev"
Documentation = "https://epochix.dev"
Repository    = "https://github.com/epochix-dev/epochix"
Issues        = "https://github.com/epochix-dev/epochix/issues"
Changelog     = "https://github.com/epochix-dev/epochix/blob/main/CHANGELOG.md"

[project.scripts]
epochix = "epochix.cli:main_entry"

[project.entry-points."epochix.parsers"]
pytorch_lightning = "epochix.parsers.pytorch_lightning:PLParser"
keras_tensorflow  = "epochix.parsers.keras_tensorflow:KerasParser"
huggingface       = "epochix.parsers.huggingface:HFParser"
ultralytics_yolo  = "epochix.parsers.ultralytics_yolo:YOLOParser"
fastai            = "epochix.parsers.fastai:FastAIParser"
accelerate        = "epochix.parsers.accelerate:AccelerateParser"
universal         = "epochix.parsers.universal:UniversalParser"

# Metaphor packs: entry point value = path to a YAML file
# [project.entry-points."epochix.metaphor_packs"]
# my_pack = "my_package:METAPHORS_YAML"

# Custom task types: entry point value = TaskDefinition instance or dict
# [project.entry-points."epochix.tasks"]
# audio = "my_package.task:TASK_DEFINITION"

# Custom exporters: entry point value = callable(run, frames, events, output_path)
# [project.entry-points."epochix.exporters"]
# latex = "my_package.exporter:EXPORTER"

[tool.hatch.build.targets.wheel]
packages = ["src/epochix"]
# Stop hatch from re-collecting the same non-.py files that force-include
# below already maps. Without these excludes hatch sees them twice and
# emits "Duplicate name" warnings at build time.
exclude = [
  "src/epochix/story_engine/templates/**",
  "src/epochix/_artifacts/**",
  "src/epochix/_demos/**",
  "src/epochix/_frontend/dist/**",
  "src/epochix/_brand/**",
]

[tool.hatch.build.targets.wheel.shared-data]
# non-Python assets that must ship inside the wheel
"src/epochix/py.typed" = "epochix/py.typed"

[tool.hatch.build.targets.wheel.force-include]
# Narrative templates (text files alongside the story_engine package).
"src/epochix/story_engine/templates" = "epochix/story_engine/templates"
# Claude artifact (JSX).
"src/epochix/_artifacts" = "epochix/_artifacts"
# Bundled demo logs — used by `epochix demo` so newcomers can see
# the dashboard without bringing their own training log.
"src/epochix/_demos" = "epochix/_demos"
# Frontend bundle vendored at release time via CI (build-frontend step).
"frontend/dist" = "epochix/_frontend/dist"
# Brand mark, composited into the GIF export's watermark. Vendored because
# `asset/` sits outside the package and is not otherwise shipped.
"asset/epochix_mark_512.png" = "epochix/_brand/mark.png"

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test      = "pytest {args}"
typecheck = "mypy --strict src/epochix"
lint      = "ruff check src tests && ruff format --check src tests"
fmt       = "ruff format src tests && ruff check --fix src tests"
bench     = "pytest tests/benchmarks --benchmark-only"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = [
  "ANN001", "ANN002", "ANN003",  # allow unannotated *args/**kwargs in tests/scripts
  "B008",  # Typer + FastAPI use function-calls-as-defaults by design
]

[tool.ruff.lint.per-file-ignores]
# Aligned layer-type → metadata mapping table reads better as wide columns.
"src/epochix/parsers/architecture_parser.py" = ["E501"]
# Tests may use long inline SQL/fixtures and nested context managers.
"tests/**" = ["E501", "SIM117"]
# Drives real Lightning/HF objects, which are untyped — Any is unavoidable.
"tests/integration/test_framework_callbacks.py" = ["ANN401"]
# Stubs standing in for wandb's untyped public API; **kwargs must accept Any
# for the stub to be substitutable for the real thing.
"tests/integration/test_wandb_api_import.py" = ["ANN401"]

[tool.mypy]
python_version   = "3.10"
strict           = true
warn_return_any  = true
warn_unused_configs = true

# Optional training-framework deps: not installed in the typecheck env (and
# unstubbed anyway). The integrations import them lazily and duck-type them.
[[tool.mypy.overrides]]
# PIL is a CORE dependency now (GIF export needs no extra), but it still
# ships no py.typed, so it stays here for the untyped-import rule.
# tensorboard joins them for the OPPOSITE reason: it ships no py.typed, so
# where it IS installed mypy reports import-untyped, and the inline
# `type: ignore[import-not-found]` it used to carry became "unused". One
# override is correct in both environments; an inline ignore is correct in
# only one of them.
module = ["lightning.*", "pytorch_lightning.*", "transformers.*", "PIL.*", "tensorboard.*", "wandb.*"]
ignore_missing_imports = true

# IPython.display.display/IFrame are untyped, so calling them from strict code
# trips disallow_untyped_calls. Only the magic module touches them.
[[tool.mypy.overrides]]
module = ["epochix.integrations.jupyter"]
disallow_untyped_calls = false

# The W&B importer calls into wandb's own untyped internals (DataStore) and a
# generated protobuf module whose attributes mypy cannot see. These only appear
# where wandb is actually installed — CI's typecheck env has no wandb, so they
# were invisible there while failing on any developer machine that did.
[[tool.mypy.overrides]]
module = ["epochix.integrations.wandb_import"]
disallow_untyped_calls = false
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-q --tb=short"
# Put the working tree ahead of anything installed. CI runs under `uv run`,
# which builds from the tree, but a plain `python -m pytest` on a machine with
# a released epochix in site-packages imports THAT instead — so the suite
# passes against code you are not editing. This was live: the tree was 0.5.76
# and the tests were importing an installed 0.5.75.
pythonpath   = ["src"]

[tool.coverage.run]
source = ["src/epochix"]
omit   = ["src/epochix/_frontend/*"]
